<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" width="100%">
  <defs>
    <style>
      text { font-family: 'Inter', sans-serif; }
      .bg { fill: #000000; }
      .panel { fill: #0A0A0A; stroke: #333333; stroke-width: 1; rx: 6; }
      
      .metric-value { fill: #FFFFFF; font-size: 28px; font-weight: 800; }
      .metric-label { fill: #888888; font-size: 11px; font-weight: 600; letter-spacing: 1px; }
      
      .bar-bg { fill: #222222; rx: 3; }
      .bar-fill-green { fill: #4ADE80; rx: 3; }
      .bar-fill-blue { fill: #38BDF8; rx: 3; }
      .bar-fill-purple { fill: #C084FC; rx: 3; }
    </style>
  </defs>

  <rect width="100%" height="100%" class="bg" />
  
  <rect x="20" y="20" width="300" height="110" class="panel" />
  <text x="40" y="50" class="metric-label">TEST ACCURACY</text>
  <text x="40" y="85" class="metric-value">92.22%</text>
  <rect x="40" y="105" width="260" height="6" class="bar-bg" />
  <rect x="40" y="105" width="240" height="6" class="bar-fill-green" />

  <rect x="340" y="20" width="300" height="110" class="panel" />
  <text x="360" y="50" class="metric-label">INFERENCE LATENCY (EDGE)</text>
  <text x="360" y="85" class="metric-value">~10 ms</text>
  <rect x="360" y="105" width="260" height="6" class="bar-bg" />
  <rect x="360" y="105" width="20" height="6" class="bar-fill-blue" />

  <rect x="660" y="20" width="320" height="110" class="panel" />
  <text x="680" y="50" class="metric-label">ONNX MODEL FOOTPRINT</text>
  <text x="680" y="85" class="metric-value">~296 KB</text>
  <rect x="680" y="105" width="280" height="6" class="bar-bg" />
  <rect x="680" y="105" width="40" height="6" class="bar-fill-purple" />
  
</svg>
