<svg viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg" width="900" height="640">
  <defs>
    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0L0 0 0 40" fill="none" stroke="#00e5ff" stroke-width="0.4" stroke-opacity="0.07"/>
    </pattern>

    <!-- Glow filters (SMIL-safe) -->
    <filter id="fcyan">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="forange">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="fgreen">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="fsoft">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Arrow markers -->
    <marker id="ac" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#00e5ff"/>
    </marker>
    <marker id="ao" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#ff6b35"/>
    </marker>
    <marker id="ag" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#ffc800"/>
    </marker>
    <marker id="av" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#8264ff"/>
    </marker>
    <marker id="an" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#a8ff3e"/>
    </marker>

    <!-- Radial gradients for packets -->
    <radialGradient id="pc"><stop offset="0%" stop-color="#00e5ff"/><stop offset="100%" stop-color="#004466"/></radialGradient>
    <radialGradient id="po"><stop offset="0%" stop-color="#ff6b35"/><stop offset="100%" stop-color="#661a00"/></radialGradient>
    <radialGradient id="pg"><stop offset="0%" stop-color="#ffc800"/><stop offset="100%" stop-color="#664400"/></radialGradient>
    <radialGradient id="pv"><stop offset="0%" stop-color="#8264ff"/><stop offset="100%" stop-color="#220066"/></radialGradient>
    <radialGradient id="pn"><stop offset="0%" stop-color="#a8ff3e"/><stop offset="100%" stop-color="#225500"/></radialGradient>
  </defs>

  <!-- ── BACKGROUND ── -->
  <rect width="900" height="640" fill="#060d18"/>
  <rect width="900" height="640" fill="url(#grid)"/>

  <!-- Scanning line (SMIL animateTransform) -->
  <rect x="0" y="0" width="900" height="2" fill="#00e5ff" opacity="0.25">
    <animateTransform attributeName="transform" type="translate"
      values="0,-2; 0,642; 0,642" keyTimes="0;0.92;1"
      dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- ── TITLE ── -->
  <text x="450" y="30" text-anchor="middle" fill="#00e5ff" font-size="10"
        font-family="Courier New, monospace" letter-spacing="5" opacity="0.6">◈  SEQUENCE DIAGRAM  ◈</text>
  <text x="450" y="56" text-anchor="middle" fill="#ffffff" font-size="20"
        font-family="Courier New, monospace" font-weight="bold" letter-spacing="1">ML Deployment Flow</text>
  <line x1="120" y1="68" x2="780" y2="68" stroke="#00e5ff" stroke-width="0.5" opacity="0.25"/>

  <!-- ════════════════════════════════════════
       PARTICIPANT HEADERS  (x: 130 310 510 730)
       ════════════════════════════════════════ -->

  <!-- Developer -->
  <rect x="78" y="78" width="104" height="52" rx="10" fill="#071828" stroke="#00e5ff" stroke-width="1.5" filter="url(#fcyan)"/>
  <text x="130" y="100" text-anchor="middle" font-size="20" font-family="serif">👨‍💻</text>
  <text x="130" y="118" text-anchor="middle" fill="#00e5ff" font-size="9" font-family="Courier New,monospace" letter-spacing="1">DEVELOPER</text>

  <!-- Training Script -->
  <rect x="258" y="78" width="104" height="52" rx="10" fill="#180900" stroke="#ff6b35" stroke-width="1.5" filter="url(#forange)"/>
  <text x="310" y="100" text-anchor="middle" font-size="20" font-family="serif">⚙️</text>
  <text x="310" y="118" text-anchor="middle" fill="#ff6b35" font-size="9" font-family="Courier New,monospace" letter-spacing="1">TRAIN SCRIPT</text>

  <!-- Converter -->
  <rect x="458" y="78" width="104" height="52" rx="10" fill="#100a00" stroke="#ffc800" stroke-width="1.5" filter="url(#fsoft)"/>
  <text x="510" y="100" text-anchor="middle" font-size="20" font-family="serif">🔬</text>
  <text x="510" y="118" text-anchor="middle" fill="#ffc800" font-size="9" font-family="Courier New,monospace" letter-spacing="1">CONVERTER</text>

  <!-- Embedded MCU -->
  <rect x="678" y="78" width="104" height="52" rx="10" fill="#081200" stroke="#a8ff3e" stroke-width="1.5" filter="url(#fgreen)"/>
  <text x="730" y="100" text-anchor="middle" font-size="20" font-family="serif">🔲</text>
  <text x="730" y="118" text-anchor="middle" fill="#a8ff3e" font-size="9" font-family="Courier New,monospace" letter-spacing="1">EMBEDDED MCU</text>

  <!-- ════════════════════════════════════════
       LIFELINES (dashed vertical)
       ════════════════════════════════════════ -->
  <line x1="130" y1="130" x2="130" y2="582" stroke="#00e5ff" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.28"/>
  <line x1="310" y1="130" x2="310" y2="582" stroke="#ff6b35" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.28"/>
  <line x1="510" y1="130" x2="510" y2="582" stroke="#ffc800" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.28"/>
  <line x1="730" y1="130" x2="730" y2="582" stroke="#a8ff3e" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.28"/>

  <!-- Activation boxes -->
  <rect x="124" y="178" width="12" height="36" rx="3" fill="#00e5ff" opacity="0.22"/>
  <rect x="304" y="218" width="12" height="60" rx="3" fill="#ff6b35" opacity="0.22"/>
  <rect x="504" y="278" width="12" height="120" rx="3" fill="#ffc800" opacity="0.22"/>
  <rect x="124" y="358" width="12" height="36" rx="3" fill="#8264ff" opacity="0.22"/>
  <rect x="724" y="418" width="12" height="80" rx="3" fill="#a8ff3e" opacity="0.22"/>

  <!-- ════════════════════════════════════════
       ROW SEPARATORS
       ════════════════════════════════════════ -->
  <line x1="60" y1="168" x2="840" y2="168" stroke="#ffffff" stroke-width="0.3" opacity="0.06"/>
  <line x1="60" y1="240" x2="840" y2="240" stroke="#ffffff" stroke-width="0.3" opacity="0.06"/>
  <line x1="60" y1="320" x2="840" y2="320" stroke="#ffffff" stroke-width="0.3" opacity="0.06"/>
  <line x1="60" y1="398" x2="840" y2="398" stroke="#ffffff" stroke-width="0.3" opacity="0.06"/>
  <line x1="60" y1="460" x2="840" y2="460" stroke="#ffffff" stroke-width="0.3" opacity="0.06"/>
  <line x1="60" y1="508" x2="840" y2="508" stroke="#ffffff" stroke-width="0.3" opacity="0.06"/>

  <!-- ════════════════════════════════════════
       MESSAGE 1: Dev → Python | "Train Model"   y=196
       ════════════════════════════════════════ -->
  <!-- Step badge -->
  <rect x="82" y="183" width="22" height="14" rx="3" fill="#00e5ff">
    <animate attributeName="opacity" values="0;1" dur="0.1s" begin="0.2s" fill="freeze"/>
  </rect>
  <text x="93" y="193" text-anchor="middle" fill="#060d18" font-size="8" font-weight="bold"
        font-family="Courier New,monospace">
    01
    <animate attributeName="opacity" values="0;1" dur="0.1s" begin="0.2s" fill="freeze"/>
  </text>

  <!-- Arrow line draw -->
  <line x1="142" y1="196" x2="298" y2="196"
        stroke="#00e5ff" stroke-width="2" marker-end="url(#ac)"
        stroke-dasharray="160" stroke-dashoffset="160">
    <animate attributeName="stroke-dashoffset" from="160" to="0" dur="0.5s" begin="0.3s" fill="freeze"/>
  </line>

  <!-- Travelling packet -->
  <circle r="5" fill="url(#pc)" filter="url(#fcyan)">
    <animate attributeName="opacity" values="0;1;1;0" dur="0.6s" begin="0.3s" fill="freeze"/>
    <animate attributeName="cx" values="142;298" dur="0.55s" begin="0.3s" fill="freeze"/>
    <animate attributeName="cy" values="196;196" dur="0.55s" begin="0.3s" fill="freeze"/>
  </circle>

  <!-- Label appears after arrow drawn -->
  <text x="220" y="190" text-anchor="middle" fill="#00e5ff" font-size="10"
        font-family="Courier New,monospace" letter-spacing="0.5">
    Train Model
    <animate attributeName="opacity" values="0;1" dur="0.1s" begin="0.85s" fill="freeze"/>
  </text>

  <!-- ════════════════════════════════════════
       MESSAGE 2: Python → TFLite | "Export .tflite"   y=262
       ════════════════════════════════════════ -->
  <rect x="262" y="249" width="22" height="14" rx="3" fill="#ff6b35">
    <animate attributeName="opacity" values="0;1" dur="0.1s" begin="1.1s" fill="freeze"/>
  </rect>
  <text x="273" y="259" text-anchor="middle" fill="#060d18" font-size="8" font-weight="bold"
        font-family="Courier New,monospace">
    02
    <animate attributeName="opacity" values="0;1" dur="0.1s" begin="1.1s" fill="freeze"/>
  </text>

  <line x1="322" y1="262" x2="498" y2="262"
        stroke="#ff6b35" stroke-width="2" marker-end="url(#ao)"
        stroke-dasharray="180" stroke-dashoffset="180">
    <animate attributeName="stroke-dashoffset" from="180" to="0" dur="0.5s" begin="1.1s" fill="freeze"/>
  </line>

  <circle r="5" fill="url(#po)" filter="url(#forange)">
    <animate attributeName="opacity" values="0;1;1;0" dur="0.6s" begin="1.1s" fill="freeze"/>
    <animate attributeName="cx" values="322;498" dur="0.55s" begin="1.1s" fill="freeze"/>
    <animate attributeName="cy" values="262;262" dur="0.55s" begin="1.1s" fill="freeze"/>
  </circle>

  <text x="410" y="255" text-anchor="middle" fill="#ff6b35" font-size="10"
        font-family="Courier New,monospace" letter-spacing="0.5">
    Export .tflite
    <animate attributeName="opacity" values="0;1" dur="0.1s" begin="1.65s" fill="freeze"/>
  </text>

  <!-- ════════════════════════════════════════
       MESSAGE 3: TFLite self-loop | "Quantize INT8"   y=300→340
       ════════════════════════════════════════ -->
  <rect x="462" y="307" width="22" height="14" rx="3" fill="#ffc800">
    <animate attributeName="opacity" values="0;1" dur="0.1s" begin="1.9s" fill="freeze"/>
  </rect>
  <text x="473" y="317" text-anchor="middle" fill="#060d18" font-size="8" font-weight="bold"
        font-family="Courier New,monospace">
    03
    <animate attributeName="opacity" values="0;1" dur="0.1s" begin="1.9s" fill="freeze"/>
  </text>

  <!-- Self-loop arc (right bump) -->
  <path d="M 522 300 C 590 300 590 345 522 345"
        fill="none" stroke="#ffc800" stroke-width="2" marker-end="url(#ag)"
        stroke-dasharray="150" stroke-dashoffset="150">
    <animate attributeName="stroke-dashoffset" from="150" to="0" dur="0.7s" begin="1.9s" fill="freeze"/>
  </path>

  <!-- Spinning ⚡ icon inside loop -->
  <circle cx="590" cy="322" r="13" fill="#1a1200" stroke="#ffc800" stroke-width="1.2">
    <animate attributeName="opacity" values="0;1" dur="0.1s" begin="1.9s" fill="freeze"/>
    <!-- pulse -->
    <animate attributeName="r" values="13;16;13" dur="1.4s" begin="2.6s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="1;0.2;1" dur="1.4s" begin="2.6s" repeatCount="indefinite"/>
  </circle>
  <text x="590" y="328" text-anchor="middle" fill="#ffc800" font-size="13" font-family="serif">
    ⚡
    <animate attributeName="opacity" values="0;1" dur="0.1s" begin="1.9s" fill="freeze"/>
  </text>

  <text x="614" y="295" text-anchor="middle" fill="#ffc800" font-size="10"
        font-family="Courier New,monospace" letter-spacing="0.5">
    Quantize INT8
    <animate attributeName="opacity" values="0;1" dur="0.1s" begin="2.6s" fill="freeze"/>
  </text>

  <!-- ════════════════════════════════════════
       MESSAGE 4: TFLite → Dev | "Generate model_data.h"   y=368  (return = dashed)
       ════════════════════════════════════════ -->
  <rect x="462" y="355" width="38" height="14" rx="3" fill="#8264ff">
    <animate attributeName="opacity" values="0;1" dur="0.1s" begin="2.9s" fill="freeze"/>
  </rect>
  <text x="481" y="365" text-anchor="middle" fill="#ffffff" font-size="8" font-weight="bold"
        font-family="Courier New,monospace">
    04 ↩
    <animate attributeName="opacity" values="0;1" dur="0.1s" begin="2.9s" fill="freeze"/>
  </text>

  <!-- Return arrow: right-to-left, dashed -->
  <line x1="498" y1="368" x2="142" y2="368"
        stroke="#8264ff" stroke-width="2" stroke-dasharray="8 5"
        marker-end="url(#av)"
        stroke-dasharray="360" stroke-dashoffset="-360">
    <animate attributeName="stroke-dashoffset" from="-360" to="0" dur="0.7s" begin="2.9s" fill="freeze"/>
  </line>

  <!-- Packet travelling right-to-left -->
  <circle r="5" fill="url(#pv)" filter="url(#fsoft)">
    <animate attributeName="opacity" values="0;1;1;0" dur="0.75s" begin="2.9s" fill="freeze"/>
    <animate attributeName="cx" values="498;142" dur="0.7s" begin="2.9s" fill="freeze"/>
    <animate attributeName="cy" values="368;368" dur="0.7s" begin="2.9s" fill="freeze"/>
  </circle>

  <text x="316" y="361" text-anchor="middle" fill="#8264ff" font-size="10"
        font-family="Courier New,monospace" letter-spacing="0.5">
    Generate model_data.h
    <animate attributeName="opacity" values="0;1" dur="0.1s" begin="3.65s" fill="freeze"/>
  </text>

  <!-- ════════════════════════════════════════
       MESSAGE 5: Dev → MCU | "Flash Firmware"   y=432
       ════════════════════════════════════════ -->
  <rect x="82" y="419" width="22" height="14" rx="3" fill="#a8ff3e">
    <animate attributeName="opacity" values="0;1" dur="0.1s" begin="3.9s" fill="freeze"/>
  </rect>
  <text x="93" y="429" text-anchor="middle" fill="#060d18" font-size="8" font-weight="bold"
        font-family="Courier New,monospace">
    05
    <animate attributeName="opacity" values="0;1" dur="0.1s" begin="3.9s" fill="freeze"/>
  </text>

  <line x1="142" y1="432" x2="718" y2="432"
        stroke="#a8ff3e" stroke-width="2" marker-end="url(#an)"
        stroke-dasharray="580" stroke-dashoffset="580">
    <animate attributeName="stroke-dashoffset" from="580" to="0" dur="0.85s" begin="3.9s" fill="freeze"/>
  </line>

  <circle r="6" fill="url(#pn)" filter="url(#fgreen)">
    <animate attributeName="opacity" values="0;1;1;0" dur="0.9s" begin="3.9s" fill="freeze"/>
    <animate attributeName="cx" values="142;718" dur="0.85s" begin="3.9s" fill="freeze"/>
    <animate attributeName="cy" values="432;432" dur="0.85s" begin="3.9s" fill="freeze"/>
  </circle>

  <text x="430" y="425" text-anchor="middle" fill="#a8ff3e" font-size="10"
        font-family="Courier New,monospace" letter-spacing="0.5">
    Flash Firmware
    <animate attributeName="opacity" values="0;1" dur="0.1s" begin="4.75s" fill="freeze"/>
  </text>

  <!-- ════════════════════════════════════════
       MESSAGE 6: MCU self-loop | "Run Inference"   y=472→512
       ════════════════════════════════════════ -->
  <rect x="682" y="459" width="22" height="14" rx="3" fill="#a8ff3e">
    <animate attributeName="opacity" values="0;1" dur="0.1s" begin="5.0s" fill="freeze"/>
  </rect>
  <text x="693" y="469" text-anchor="middle" fill="#060d18" font-size="8" font-weight="bold"
        font-family="Courier New,monospace">
    06
    <animate attributeName="opacity" values="0;1" dur="0.1s" begin="5.0s" fill="freeze"/>
  </text>

  <path d="M 742 472 C 810 472 810 517 742 517"
        fill="none" stroke="#a8ff3e" stroke-width="2" marker-end="url(#an)"
        stroke-dasharray="150" stroke-dashoffset="150">
    <animate attributeName="stroke-dashoffset" from="150" to="0" dur="0.7s" begin="5.0s" fill="freeze"/>
  </path>

  <!-- Pulsing rocket icon -->
  <circle cx="810" cy="494" r="14" fill="#081200" stroke="#a8ff3e" stroke-width="1.5">
    <animate attributeName="opacity" values="0;1" dur="0.1s" begin="5.0s" fill="freeze"/>
    <!-- continuous pulse after appear -->
    <animate attributeName="r" values="14;18;14" dur="1.2s" begin="5.7s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="1;0.15;1" dur="1.2s" begin="5.7s" repeatCount="indefinite"/>
  </circle>
  <text x="810" y="500" text-anchor="middle" fill="#a8ff3e" font-size="14" font-family="serif">
    🚀
    <animate attributeName="opacity" values="0;1" dur="0.1s" begin="5.0s" fill="freeze"/>
  </text>

  <text x="770" y="468" text-anchor="middle" fill="#a8ff3e" font-size="10"
        font-family="Courier New,monospace" letter-spacing="0.5">
    Run Inference
    <animate attributeName="opacity" values="0;1" dur="0.1s" begin="5.7s" fill="freeze"/>
  </text>

  <!-- ════════════════════════════════════════
       BOTTOM PARTICIPANT MIRRORS
       ════════════════════════════════════════ -->
  <rect x="78" y="560" width="104" height="34" rx="8" fill="#071828" stroke="#00e5ff" stroke-width="1.2" opacity="0.65"/>
  <text x="130" y="582" text-anchor="middle" fill="#00e5ff" font-size="9"
        font-family="Courier New,monospace" letter-spacing="1" opacity="0.7">DEVELOPER</text>

  <rect x="258" y="560" width="104" height="34" rx="8" fill="#180900" stroke="#ff6b35" stroke-width="1.2" opacity="0.65"/>
  <text x="310" y="582" text-anchor="middle" fill="#ff6b35" font-size="9"
        font-family="Courier New,monospace" letter-spacing="1" opacity="0.7">TRAIN SCRIPT</text>

  <rect x="458" y="560" width="104" height="34" rx="8" fill="#100a00" stroke="#ffc800" stroke-width="1.2" opacity="0.65"/>
  <text x="510" y="582" text-anchor="middle" fill="#ffc800" font-size="9"
        font-family="Courier New,monospace" letter-spacing="1" opacity="0.7">CONVERTER</text>

  <rect x="678" y="560" width="104" height="34" rx="8" fill="#081200" stroke="#a8ff3e" stroke-width="1.2" opacity="0.65"/>
  <text x="730" y="582" text-anchor="middle" fill="#a8ff3e" font-size="9"
        font-family="Courier New,monospace" letter-spacing="1" opacity="0.7">EMBEDDED MCU</text>

  <!-- ════════════════════════════════════════
       LEGEND BAR
       ════════════════════════════════════════ -->
  <line x1="60" y1="606" x2="840" y2="606" stroke="#00e5ff" stroke-width="0.4" opacity="0.2"/>
  <circle cx="140" cy="618" r="4" fill="#00e5ff"/>
  <text x="150" y="622" fill="#00e5ff" font-size="9" font-family="Courier New,monospace" opacity="0.7">Forward call</text>

  <line x1="250" y1="618" x2="285" y2="618" stroke="#8264ff" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="295" y="622" fill="#8264ff" font-size="9" font-family="Courier New,monospace" opacity="0.7">Return</text>

  <circle cx="390" cy="618" r="4" fill="#ffc800"/>
  <circle cx="390" cy="618" r="9" fill="none" stroke="#ffc800" stroke-width="1" opacity="0.4">
    <animate attributeName="r" values="5;11;5" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0;0.5" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="407" y="622" fill="#ffc800" font-size="9" font-family="Courier New,monospace" opacity="0.7">Self-loop (internal op)</text>

  <circle cx="590" cy="618" r="4" fill="#a8ff3e"/>
  <circle cx="590" cy="618" r="9" fill="none" stroke="#a8ff3e" stroke-width="1" opacity="0.4">
    <animate attributeName="r" values="5;12;5" dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0;0.5" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <text x="607" y="622" fill="#a8ff3e" font-size="9" font-family="Courier New,monospace" opacity="0.7">Live inference pulse</text>
</svg>
